name: publish

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Smoke installed wheel before upload
        run: |
          python -m venv "$RUNNER_TEMP/timemachines-wheel"
          "$RUNNER_TEMP/timemachines-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/timemachines-wheel/bin/python" -I scripts/smoke_installed_wheel.py
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload dist/*
